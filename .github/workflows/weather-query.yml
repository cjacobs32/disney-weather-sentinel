name: Consulta meteorológica Disney

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operación a ejecutar
        required: true
        type: choice
        default: future
        options:
          - future
          - historical
          - capture
          - compare
      start_date:
        description: Fecha desde (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: Fecha hasta (YYYY-MM-DD)
        required: true
        type: string
      climate_years:
        description: Años usados para la referencia climática
        required: true
        type: choice
        default: "10"
        options:
          - "5"
          - "10"
          - "15"
          - "20"

permissions:
  contents: write

concurrency:
  group: disney-weather-manual-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar proyecto
        run: pip install -e ".[dev]"

      - name: Validar código
        run: |
          ruff check .
          mypy src
          pytest -q

      - name: Ejecutar consulta solicitada
        env:
          OPERATION: ${{ inputs.operation }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          CLIMATE_YEARS: ${{ inputs.climate_years }}
          WEATHER_LATITUDE: "28.3772"
          WEATHER_LONGITUDE: "-81.5707"
          WEATHER_TIMEZONE: "America/New_York"
          WEATHER_LOCATION_NAME: "Walt Disney World Resort, Orlando"
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            historical)
              disney-weather historical --start "$START_DATE" --end "$END_DATE"
              ;;
            future)
              disney-weather future --start "$START_DATE" --end "$END_DATE" \
                --climate-years "$CLIMATE_YEARS"
              ;;
            capture)
              disney-weather capture --start "$START_DATE" --end "$END_DATE"
              ;;
            compare)
              disney-weather compare --start "$START_DATE" --end "$END_DATE"
              ;;
            *)
              echo "Operación no soportada: $OPERATION" >&2
              exit 2
              ;;
          esac

      - name: Mostrar informe en el resumen de la ejecución
        shell: bash
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Versionar resultados
        shell: bash
        run: |
          git add data reports docs/generated
          if git diff --cached --quiet; then
            echo "No hay cambios generados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(weather): ${{ inputs.operation }} ${{ inputs.start_date }}_${{ inputs.end_date }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
